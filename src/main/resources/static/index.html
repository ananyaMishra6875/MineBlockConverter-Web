<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>MineBlockConverter</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>

        <div class="container">
            <h1>MineBlockConverter</h1>
            <label>Material</label>
            <select id="materialSelect">
            </select>

            <label>Quantity</label>

            <input
            type="number"
            id="quantityInput"
            min="1"
            value="1">

            <button id="convertButton">
                Convert
            </button>

            <hr>

            <h2>Resources Needed</h2>

            <p id="planks">
                Planks:
            </p>

            <p id="logs">
                Logs:
            </p>

        </div>
        <script src="script.js"></script>
    </body>
</html>
